name: Standards

on:
  pull_request:

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/check-standards.mjs --since "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: npm run lint
