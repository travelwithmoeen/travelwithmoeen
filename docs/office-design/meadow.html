.switch .track { width: var(--space-10); height: var(--space-6); border-radius: var(--r-pill); background: var(--surface-2); border: var(--border-w) solid var(--border-strong); position: relative; transition: background-color var(--dur) var(--ease); flex: none; }

.radios { border: 0; padding: 0; margin: 0; display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(var(--space-24) * 2 + var(--space-2))), 1fr)); }

.radio-card b { display: block; }

.drop { border: var(--border-w-md) dashed var(--border-strong); border-radius: var(--r-m); padding: var(--space-5); display: grid; justify-items: center; gap: var(--space-2); text-align: center; background: var(--surface); }
.drop:focus-within { outline: var(--focus-w) solid var(--focus); outline-offset: var(--focus-offset); }

.drop-label { cursor: pointer; color: var(--text-2); }

.filechip { display: flex; gap: var(--space-3); align-items: center; padding: var(--space-2) var(--space-3); border: var(--border-w) solid var(--border); border-radius: var(--r-s); background: var(--surface); text-align: left; max-width: 100%; }
.fthumb { width: var(--space-12); height: var(--space-8); border-radius: var(--r-xs); flex: none; }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap) var(--space-5); }
.row-actions { display: flex; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
.row-actions:has(> :only-child) { justify-content: flex-end; }

/* ---------- Badges, alerts ---------- */
.badge { display: inline-flex; align-items: center; gap: var(--space-2); height: var(--space-6); padding: 0 var(--space-2); border-radius: var(--r-s); font: 500 var(--text-xs)/var(--leading-none) var(--font); white-space: nowrap; background: var(--surface-2); color: var(--text-2); border: var(--border-w) solid transparent; }
.badge .dot { width: var(--space-2); height: var(--space-2); border-radius: 50%; background: currentColor; }
.b-info { background: var(--info-soft); color: var(--info-text); }
.b-success { background: var(--success-soft); color: var(--success-text); }
.b-warning { background: var(--warning-soft); color: var(--warning-text); }
.b-danger { background: var(--danger-soft); color: var(--danger-text); }

.alert { display: grid; grid-template-columns: var(--space-5) 1fr; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--r-m); border: var(--border-w) solid var(--border); font-size: var(--text-sm); line-height: var(--leading-body); }
.alert > .ic { width: var(--icon-md); height: var(--icon-md); }
.alert b { display: block; font-weight: 600; }
.alert p, .alert ul { margin: var(--space-half) 0 0; color: var(--text-2); }
.alert ul { padding-left: var(--space-5); }
.a-info { background: var(--info-soft); border-color: var(--info-line, var(--border)); } .a-info > .ic { color: var(--info-text); }
.a-success { background: var(--success-soft); } .a-success > .ic { color: var(--success-text); }
.a-warning { background: var(--warning-soft); } .a-warning > .ic { color: var(--warning-text); }
.a-danger { background: var(--danger-soft); border-color: var(--danger); } .a-danger > .ic { color: var(--danger-text); }
.a-danger a { color: var(--danger-text); }
:root[data-theme="hc"] .alert { border: var(--border-w-lg) solid var(--hc-ink); }
.form-errors { margin-bottom: var(--gap); }
.form-errors:focus { outline: var(--focus-w) solid var(--focus); outline-offset: var(--focus-offset); }

/* ---------- Page ---------- */
.main { padding: var(--space-6) var(--space-8) var(--space-24); max-width: var(--w-xl); width: 100%; margin: 0 auto; outline: none; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-3) var(--space-5); margin-bottom: var(--space-5); }
.page-head h1 { font: var(--h1); letter-spacing: var(--h1-ls, var(--tracking-snug)); display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; outline: none; }
.page-head .desc, .drawer .desc { color: var(--text-2); margin-top: var(--space-1); }
.ph-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.crumbs ol { list-style: none; display: flex; flex-wrap: wrap; gap: var(--space-1); align-items: center; margin: 0 0 var(--space-2); padding: 0; font-size: var(--text-sm); color: var(--text-2); }

.crumbs .ic { width: var(--icon-sm); height: var(--icon-sm); }

.tabs { display: flex; gap: var(--space-1); border-bottom: var(--border-w) solid var(--border); margin-bottom: var(--space-4); overflow-x: auto; scrollbar-width: thin; }
.tab { position: relative; display: inline-flex; gap: var(--space-2); align-items: center; padding: var(--space-3) var(--space-3); color: var(--text-2); text-decoration: none; font-weight: 500; white-space: nowrap; border-radius: var(--r-s) var(--r-s) 0 0; }
.tab:hover { color: var(--text); background: var(--surface-hover); }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: var(--space-2); right: var(--space-2); bottom: calc(var(--space-0) * -1); height: var(--border-w-xl); border-radius: var(--r-xs) var(--r-xs) 0 0; background: var(--primary); }
.tab-n { font-size: var(--text-xs); color: var(--text-3); font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: var(--border-w) solid var(--card-line, var(--border)); border-radius: var(--r-m); box-shadow: var(--shadow-1); margin-bottom: var(--gap); min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: var(--space-3); padding: var(--pad) var(--pad) 0; }
.card-head h3 { font: 600 var(--text-md)/var(--leading-body) var(--font); }
.card-head p { color: var(--text-2); margin-top: var(--space-half); }
.card-body { padding: var(--pad); display: grid; gap: var(--gap); }
.card-head + .card-body { padding-top: var(--space-4); }
.card-danger { border-color: var(--danger); }
.card-danger .card-head { padding-bottom: var(--pad); align-items: center; }

.toolbar { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-bottom: var(--space-4); }
.search-box { position: relative; flex: 1 1 calc(var(--space-20) * 3 + var(--space-5)); max-width: calc(var(--space-24) * 3 + var(--space-20) + var(--space-3)); }
.search-box .ic { position: absolute; left: var(--space-3); top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.search-box .input { padding-left: var(--space-10); }
.toolbar .select { width: auto; flex: none; }
.filter-count { font-size: var(--text-sm); color: var(--text-2); margin-left: auto; }

/* Stats and dashboard */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); margin-bottom: var(--gap); }
.stat { display: grid; gap: var(--space-1); padding: var(--space-4) var(--space-5); background: var(--surface); border: var(--border-w) solid var(--card-line, var(--border)); border-radius: var(--r-m); box-shadow: var(--shadow-1); color: var(--text); text-decoration: none; }
.stat:hover { border-color: var(--border-strong); }
.stat-k { display: flex; gap: var(--space-2); align-items: center; color: var(--text-2); font-weight: 500; font-size: var(--text-sm); }
.stat-v { font: 600 var(--text-3xl)/var(--leading-snug) var(--font-display, var(--font)); font-variant-numeric: tabular-nums; letter-spacing: var(--tracking-snug); }
.stat-m { font-size: var(--text-sm); color: var(--text-3); }

.mini-list { list-style: none; margin: 0; padding: var(--space-2) 0 var(--space-2); }
.mini-list a { display: flex; gap: var(--space-3); align-items: center; justify-content: space-between; padding: var(--space-3) var(--pad); color: var(--text); text-decoration: none; }
.mini-list a:hover { background: var(--surface-hover); }
.mini-main { display: grid; min-width: 0; }
.mini-main small { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-meta { display: flex; gap: var(--space-2); flex: none; }
.quick { grid-template-columns: 1fr; gap: var(--space-2); }
.quick .btn { justify-content: flex-start; }

/* Table */
.tbl-wrap { background: var(--surface); border: var(--border-w) solid var(--card-line, var(--border)); border-radius: var(--r-m); overflow: auto; box-shadow: var(--shadow-1); margin-bottom: var(--gap); }
.tbl-wrap.flat { box-shadow: none; margin: 0; }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--text-sm); }
.tbl th { text-align: left; font: 600 var(--text-xs)/var(--leading-snug) var(--font); color: var(--text-2); background: var(--surface-2); padding: var(--space-3) var(--space-4); border-bottom: var(--border-w) solid var(--border); white-space: nowrap; position: sticky; top: 0; z-index: var(--z-raised); }
.tbl td { padding: var(--space-2) var(--space-4); height: var(--size-lg); border-bottom: var(--border-w) solid var(--border); vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: var(--surface-hover); }
.tbl tbody tr { position: relative; }
.tbl .r { text-align: right; }
.tbl .clip { max-width: calc(var(--space-24) * 3 + var(--space-12) + var(--space-1)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.tbl-plain th[scope="row"] { position: static; background: none; font-size: var(--text-sm); color: var(--text); width: 30%; white-space: normal; }
.tbl-edit td { white-space: nowrap; }
.tbl-edit tbody tr:hover td { background: transparent; }
.cell-link { color: var(--text); text-decoration: none; }
.cell-link::after { content: ""; position: absolute; inset: 0; }
.cell-link:hover b, .cell-link:hover { text-decoration: underline; }
.cell-link:focus-visible { outline: none; }
.cell-link:focus-visible::after { outline: var(--focus-w) solid var(--focus); outline-offset: var(--focus-offset-inset); }
.cell-sub { display: block; color: var(--text-2); font-size: var(--text-xs); }
.user-cell { display: flex; gap: var(--space-3); align-items: center; }
.yes { color: var(--success-text); }
.mono { font-family: var(--font-mono); font-size: var(--text-xs); }

/* Rows */
.rowlist { list-style: none; margin: 0 0 var(--gap); padding: 0; background: var(--surface); border: var(--border-w) solid var(--card-line, var(--border)); border-radius: var(--r-m); box-shadow: var(--shadow-1); overflow: hidden; }
.rowlist li + li { border-top: var(--border-w) solid var(--border); }
.row { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); color: var(--text); text-decoration: none; min-height: var(--size-lg); }
.row:hover { background: var(--surface-hover); }
.row[aria-current="true"] { background: var(--selected); box-shadow: inset var(--border-w-xl) 0 0 var(--primary); }
.row-thumb { width: var(--space-12); height: var(--space-10); border-radius: var(--r-s); flex: none; }
.row-main { flex: 1; min-width: 0; display: grid; }
.row-main b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-main small { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta { display: flex; gap: var(--space-2); align-items: center; flex: none; }
.row-chev { color: var(--text-3); }
.unread { display: inline-block; width: var(--space-2); height: var(--space-2); border-radius: 50%; background: var(--primary); vertical-align: middle; }

/* Card grid */
.cardgrid { list-style: none; margin: 0 0 var(--gap); padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, calc(var(--space-20) * 3)), 1fr)); gap: var(--gap); }
.tile { display: grid; height: 100%; background: var(--surface); border: var(--border-w) solid var(--card-line, var(--border)); border-radius: var(--r-m); overflow: hidden; color: var(--text); text-decoration: none; box-shadow: var(--shadow-1); transition: box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease); }
.tile:hover { box-shadow: var(--shadow-2); }
.tile-img { aspect-ratio: 16 / 10; display: flex; align-items: flex-start; justify-content: flex-end; padding: var(--space-3); }
.tile-body { display: grid; gap: var(--space-1); padding: var(--space-4) var(--space-4) var(--space-4); align-content: start; }
.tile-title { font-weight: 600; line-height: var(--leading-snug); }
.tile-body small { color: var(--text-2); }
.tile-meta { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-1); }

/* Photo grid */
.photogrid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, calc(var(--space-20) + var(--space-24) + var(--space-1))), 1fr)); grid-auto-rows: calc(var(--space-24) + var(--space-12) + var(--space-2)); grid-auto-flow: dense; gap: var(--space-3); }
.photogrid .span-tall { grid-row: span 2; }
.photogrid .span-wide { grid-column: span 2; }
.photogrid .span-large { grid-column: span 2; grid-row: span 2; }
.photo { position: relative; display: block; height: 100%; border-radius: var(--r-m); overflow: hidden; color: var(--ink-inverse); text-decoration: none; }
.photo[aria-current="true"] { outline: var(--border-w-xl) solid var(--primary); outline-offset: var(--focus-offset); }
.photo-img { position: absolute; inset: 0; }
.photo-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--space-6) var(--space-3) var(--space-2); background: linear-gradient(transparent, var(--photo-scrim)); display: grid; font-size: var(--text-sm); line-height: var(--leading-snug); }
.photo-cap small { color: var(--photo-cap); }

/* Slides */
.slide-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-3); }
.slide-row { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); background: var(--surface); border: var(--border-w) solid var(--card-line, var(--border)); border-radius: var(--r-m); box-shadow: var(--shadow-1); }
.slide-thumb { width: var(--space-16); height: var(--space-12); border-radius: var(--r-s); flex: none; }
.slide-actions { display: flex; gap: var(--space-2); align-items: center; }

/* Repeaters */
.repeat { display: grid; gap: var(--space-3); }
.rep-item { position: relative; border: var(--border-w) solid var(--border); border-radius: var(--r-m); padding: var(--space-4); margin: 0; background: var(--surface-2); min-width: 0; }
.rep-head { font-weight: 600; padding: 0 var(--space-2); }
.rep-tools { position: absolute; top: calc(var(--space-4) * -1); right: var(--space-3); display: flex; gap: var(--space-half); background: var(--surface); border: var(--border-w) solid var(--border); border-radius: var(--r-s); padding: var(--space-half); }
.rep-tools .btn { height: var(--space-6); }
.rep-tools .btn-icon { width: var(--space-6); }

/* Save bar */
.savebar { position: sticky; bottom: var(--space-3); z-index: var(--z-sticky); display: none; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); margin-top: var(--gap); background: var(--surface); border: var(--border-w) solid var(--border-strong); border-radius: var(--r-m); box-shadow: var(--shadow-3); }
form[data-dirty] .savebar, .savebar[data-always] { display: flex; }
.savebar[data-always] { position: static; box-shadow: none; border-color: var(--border); }
.sb-msg { display: flex; gap: var(--space-2); align-items: center; font-weight: 500; }
.sb-dot { width: var(--space-2); height: var(--space-2); border-radius: 50%; background: var(--warning-dot); }
.savebar[data-always] .sb-dot { display: none; }
.sb-actions { display: flex; gap: var(--space-2); margin-left: auto; }

/* Requests */
.dl { display: grid; grid-template-columns: max-content 1fr; gap: var(--space-2) var(--space-4); margin: 0; }
.dl dt { color: var(--text-2); }
.dl dd { margin: 0; overflow-wrap: anywhere; }
.message { padding: var(--space-4); border-radius: var(--r-s); background: var(--surface-2); white-space: pre-wrap; line-height: var(--leading-loose); }
.req-detail { display: grid; gap: var(--space-4); }
.req-head { display: flex; justify-content: space-between; gap: var(--space-3); align-items: flex-start; }
.req-head h2 { font: 600 var(--text-lg)/var(--leading-body) var(--font); outline: none; }
.status-form { display: grid; gap: var(--space-3); padding-top: var(--space-1); border-top: var(--border-w) solid var(--border); padding-top: var(--space-4); }
.detail-grid { max-width: calc(var(--space-24) * 7 + var(--space-20) + var(--space-2)); }
.inbox { display: grid; grid-template-columns: minmax(0, calc(var(--space-24) * 3 + var(--space-20) + var(--space-3))) minmax(0, 1fr); gap: var(--gap); align-items: start; }
.inbox-list { max-height: 68vh; overflow: auto; }
.inbox-detail { position: sticky; top: var(--space-20); padding: var(--pad); }
.avatar { width: var(--space-8); height: var(--space-8); border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-soft-text); font: 600 var(--text-xs)/var(--leading-none) var(--font); flex: none; }
.avatar.sm { width: var(--space-8); height: var(--space-8); }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); align-items: start; }
.board-col { background: var(--surface-2); border-radius: var(--r-m); padding: var(--space-3); }
.board-h { display: flex; gap: var(--space-2); align-items: center; font-size: var(--text-sm); margin-bottom: var(--space-3); }
.board-col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-3); }
.board-card { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4); background: var(--surface); border-radius: var(--r-m); border: var(--border-w) solid var(--card-line, var(--border)); color: var(--text); text-decoration: none; box-shadow: var(--shadow-1); }
.board-card:hover { box-shadow: var(--shadow-2); }
.bc-top { display: flex; justify-content: space-between; gap: var(--space-2); align-items: center; }
.board-card small { color: var(--text-2); }
.bc-foot { display: flex; gap: var(--space-2); align-items: center; font-size: var(--text-xs); color: var(--text-3); }
.bc-foot .ic { width: var(--icon-sm); height: var(--icon-sm); }
.board-empty { color: var(--text-3); font-size: var(--text-sm); padding: var(--space-2); }

/* Quote */
.quote-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--gap); align-items: start; }
.quote-result { position: sticky; top: var(--space-20); }
.sum { display: grid; grid-template-columns: 1fr auto; gap: var(--space-2) var(--space-4); margin: 0; font-variant-numeric: tabular-nums; }
.sum dd { margin: 0; text-align: right; }
.sum-total { font: 600 var(--text-xl)/var(--leading-snug) var(--font-display, var(--font)); border-top: var(--border-w) solid var(--border); padding-top: var(--space-2); }

/* Drawer */
.drawer-scrim { position: fixed; inset: 0; background: var(--overlay); z-index: var(--z-overlay); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(calc(var(--space-24) * 6 + var(--space-6)), 100%); background: var(--canvas); z-index: var(--z-modal); display: flex; flex-direction: column; box-shadow: var(--shadow-3); animation: slideIn var(--dur) var(--ease); }
@keyframes slideIn { from { transform: translateX(var(--space-6)); opacity: .6; } }
.drawer-head { display: flex; justify-content: space-between; gap: var(--space-3); align-items: flex-start; padding: var(--space-5) var(--space-5); border-bottom: var(--border-w) solid var(--border); background: var(--surface); }
.drawer-head h2 { font: 600 var(--text-lg)/var(--leading-body) var(--font); outline: none; }
.drawer-body { flex: 1; overflow: auto; padding: var(--space-5); }
.drawer-body .savebar { bottom: 0; }
:root[data-theme="hc"] .drawer { border-left: var(--border-w-xl) solid var(--hc-ink); }

/* Editor with preview */
.edit-split { display: grid; grid-template-columns: minmax(0, 1fr) var(--w-xs); gap: var(--space-6); align-items: start; }
.preview { position: sticky; top: var(--space-24); }
.preview-label { display: flex; gap: var(--space-2); align-items: center; font-size: var(--text-xs); font-weight: 600; color: var(--text-2); margin-bottom: var(--space-2); text-transform: uppercase; letter-spacing: var(--tracking-label); }
.pv-card { background: var(--surface); border: var(--border-w) solid var(--border); border-radius: var(--r-m); overflow: hidden; box-shadow: var(--shadow-2); }
.pv-img { display: flex; justify-content: flex-end; align-items: flex-start; padding: var(--space-3); aspect-ratio: 16 / 10; }
.pv-img.tall { aspect-ratio: 4 / 3; align-items: flex-end; justify-content: flex-start; }
.pv-over { color: var(--ink-inverse); font: 700 var(--text-2xl)/var(--leading-tight) var(--font-display, var(--font)); text-shadow: 0 var(--space-half) var(--space-2) var(--scrim-45); }
.pv-body { padding: var(--space-4) var(--space-4) var(--space-4); display: grid; gap: var(--space-2); }
.pv-body b { font: 600 var(--text-md)/var(--leading-snug) var(--font-display, var(--font)); }
.pv-body small { color: var(--text-2); display: flex; gap: var(--space-1); align-items: center; flex-wrap: wrap; }
.pv-body small .ic { width: var(--icon-sm); height: var(--icon-sm); }
.pv-body p { color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.pv-price, .pv-link { font-weight: 600; color: var(--link); display: inline-flex; gap: var(--space-1); align-items: center; }
.pv-quote .pv-body p { font-style: italic; color: var(--text); -webkit-line-clamp: 6; }
.pv-slide { display: grid; place-items: center; padding: var(--space-8) 0; }
.pv-slide-card { width: calc(var(--space-24) * 2 + var(--space-2)); height: calc(var(--space-24) * 2 + var(--space-16) + var(--space-1)); border-radius: var(--r-l); display: flex; align-items: flex-end; padding: var(--space-4); color: var(--ink-inverse); box-shadow: var(--shadow-3); transition: transform var(--dur) var(--ease); }
.pv-slide-card b { text-shadow: 0 var(--space-half) var(--space-2) var(--scrim-50); font-size: var(--text-lg); }

/* Empty, denied */
.empty { display: grid; justify-items: center; text-align: center; gap: var(--space-2); padding: var(--space-10) var(--space-5); }
.empty-ic { width: var(--space-12); height: var(--space-12); border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
.empty h3 { font: 600 var(--text-md)/var(--leading-body) var(--font); }
.empty p { color: var(--text-2); max-width: 44ch; }
.denied { max-width: calc(var(--space-24) * 5 + var(--space-20)); margin: var(--space-16) auto; background: var(--surface); border: var(--border-w) solid var(--border); border-radius: var(--r-m); }
.denied .empty-ic { background: var(--danger-soft); color: var(--danger-text); }

/* Dialog */
.dlg-backdrop { position: fixed; inset: 0; z-index: var(--z-modal); background: var(--overlay); display: grid; place-items: center; padding: var(--space-4); animation: fade var(--dur) var(--ease); }
@keyframes fade { from { opacity: 0; } }
.dlg { width: min(var(--w-sm), 100%); max-height: calc(100vh - var(--space-8)); overflow: auto; background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow-3); border: var(--border-w) solid var(--border); }
:root[data-theme="hc"] .dlg { border: var(--border-w-xl) solid var(--hc-ink); }
.dlg-body { display: flex; gap: var(--space-4); padding: var(--space-6) var(--space-6) var(--space-2); }
.dlg-text { flex: 1; min-width: 0; display: grid; gap: var(--space-2); }
.dlg-text h2 { font: 600 var(--text-lg)/var(--leading-body) var(--font); }
.dlg-text p { color: var(--text-2); }
.dlg-fields { display: grid; gap: var(--space-4); margin-top: var(--space-2); }
.dlg-ic { width: var(--space-10); height: var(--space-10); flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-soft-text); }
.dlg-ic-danger { background: var(--danger-soft); color: var(--danger-text); }
.dlg-foot { display: flex; justify-content: flex-end; gap: var(--space-2); padding: var(--space-5) var(--space-6) var(--space-6); flex-wrap: wrap; }
.sheet-nav { display: grid; gap: var(--space-1); margin-top: var(--space-2); }
.sheet-item { display: flex; gap: var(--space-3); align-items: center; padding: var(--space-3); border-radius: var(--r-s); color: var(--text); text-decoration: none; font-weight: 500; }
.sheet-item:hover { background: var(--surface-hover); }

/* Toasts */
.toasts { position: fixed; right: var(--space-4); bottom: var(--space-4); z-index: var(--z-toast); display: grid; gap: var(--space-3); width: min(calc(var(--space-24) * 3 + var(--space-20) + var(--space-3)), calc(100vw - var(--space-8))); }
.toast { display: grid; grid-template-columns: var(--space-5) 1fr auto; gap: var(--space-3); align-items: start; padding: var(--space-3) var(--space-3) var(--space-3) var(--space-4); background: var(--surface); border: var(--border-w) solid var(--border); border-radius: var(--r-m); box-shadow: var(--shadow-3); font-size: var(--text-sm); animation: rise var(--dur) var(--ease); }
.toast.out { opacity: 0; transition: opacity var(--dur-leave); }
.toast > .ic { width: var(--icon-md); height: var(--icon-md); color: var(--success-text); margin-top: var(--space-0); }
.toast.t-info > .ic { color: var(--info-text); }
.toast p { color: var(--text-2); margin-top: var(--space-half); overflow-wrap: anywhere; }
.toast-actions { display: flex; gap: var(--space-half); }
.toast.static { position: static; max-width: calc(var(--space-24) * 3 + var(--space-20) + var(--space-3)); animation: none; }
@keyframes rise { from { transform: translateY(var(--space-2)); opacity: 0; } }
:root[data-theme="hc"] .toast { border: var(--border-w-lg) solid var(--hc-ink); }

/* Palette */
.pal-backdrop { position: fixed; inset: 0; z-index: var(--z-modal); background: var(--overlay); display: grid; justify-items: center; align-items: start; padding: 12vh var(--space-4) var(--space-4); }
.pal { width: min(calc(var(--space-24) * 6 + var(--space-10) + var(--space-1)), 100%); background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow-3); overflow: hidden; border: var(--border-w) solid var(--border); }
.pal-in { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-4); border-bottom: var(--border-w) solid var(--border); }
.pal-in input { flex: 1; height: var(--size-lg); border: 0; background: transparent; color: var(--text); font: 400 var(--text-md) var(--font); outline: none; }
.pal-in kbd, .cmd kbd { font-size: var(--text-xs); padding: var(--space-half) var(--space-2); border: var(--border-w) solid var(--border-strong); border-radius: var(--r-xs); color: var(--text-2); }
#pal-list { list-style: none; margin: 0; padding: var(--space-2); max-height: 50vh; overflow: auto; }
#pal-list li { display: flex; gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-3); border-radius: var(--r-s); cursor: pointer; }
#pal-list li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#pal-list li small { color: var(--text-2); flex: none; }
#pal-list li[aria-selected="true"] { background: var(--selected); box-shadow: inset var(--border-w-xl) 0 0 var(--primary); }
.pal-empty { color: var(--text-2); }

/* Popovers */
.pop-wrap { position: relative; }
.pop { position: absolute; top: calc(100% + var(--space-2)); left: 0; z-index: var(--z-overlay); min-width: calc(var(--space-24) * 2 + var(--space-5) + var(--space-2)); background: var(--surface); color: var(--text); border: var(--border-w) solid var(--border); border-radius: var(--r-m); box-shadow: var(--shadow-3); padding: var(--space-2); display: grid; gap: var(--space-half); }
.pop-right { left: auto; right: 0; }
.pop-head { display: grid; padding: var(--space-2) var(--space-3) var(--space-3); border-bottom: var(--border-w) solid var(--border); margin-bottom: var(--space-1); }
.pop-head small { color: var(--text-2); }
.pop-item { display: flex; gap: var(--space-3); align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--r-s); color: var(--text); text-decoration: none; background: none; border: 0; font: 500 var(--text-sm) var(--font); cursor: pointer; text-align: left; width: 100%; }
.pop-item:hover { background: var(--surface-hover); }
.pop-item[aria-current="page"] { background: var(--selected); }

/* Sidebar shell */
.shell-side { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - var(--demo-h)); }
.side { position: sticky; top: var(--demo-h); height: calc(100vh - var(--demo-h)); overflow-y: auto; background: var(--nav-bg); color: var(--nav-text); display: flex; flex-direction: column; padding: var(--space-4) var(--space-3); gap: var(--space-half); z-index: var(--z-sticky); }
.brand { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-1) var(--space-2) var(--space-4); color: inherit; text-decoration: none; }
.logo { width: var(--space-8); height: var(--space-8); border-radius: var(--r-s); display: grid; place-items: center; background: var(--logo-bg, var(--accent)); color: var(--logo-ink, var(--ink-warm)); font: 700 var(--text-sm)/var(--leading-none) var(--font); flex: none; }
.brand-text { display: grid; line-height: var(--leading-tight); flex: 1; }
.brand-text b { font-size: var(--text-sm); }
.brand-text small { color: var(--nav-muted); font-size: var(--text-xs); }
.nav { display: grid; gap: var(--space-half); }
.nav-sec { font: 600 var(--text-xs)/var(--leading-snug) var(--font); letter-spacing: var(--tracking-nav); text-transform: uppercase; color: var(--nav-muted); padding: var(--space-4) var(--space-3) var(--space-1); }
.nav-item { display: flex; align-items: center; gap: var(--space-3); min-height: var(--size-md); padding: 0 var(--space-3); border-radius: var(--r-s); color: var(--nav-text); text-decoration: none; font-weight: 500; position: relative; }
.nav-item:hover { background: var(--nav-hover); }
.nav-item[aria-current="page"] { background: var(--nav-active); color: var(--nav-active-text); }
.me { margin-top: auto; display: flex; gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-1) 0; border-top: var(--border-w) solid var(--nav-line, var(--border)); }
.me-text { flex: 1; min-width: 0; display: grid; line-height: var(--leading-tight); }
.me-text b { font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-text small { color: var(--nav-muted); font-size: var(--text-xs); }
.me .btn, .side-close { color: var(--nav-text); }
.me .btn:hover, .side-close:hover { background: var(--nav-hover); }
.body { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: var(--demo-h); z-index: var(--z-sticky); display: flex; align-items: center; gap: var(--space-3); min-height: var(--topbar-h); padding: var(--space-2) var(--space-6); background: var(--topbar-bg, var(--canvas)); border-bottom: var(--border-w) solid var(--border); }
.topbar-title { font-weight: 600; }
.cmd { display: inline-flex; align-items: center; gap: var(--space-3); min-width: min(calc(var(--space-24) * 4 + var(--space-8) + var(--space-1)), 50vw); height: var(--size-md); padding: 0 var(--space-3) 0 var(--space-3); border: var(--border-w) solid var(--border-strong); border-radius: var(--r-s); background: var(--surface); color: var(--text-2); font: 400 var(--text-sm) var(--font); cursor: pointer; }
.cmd span { flex: 1; text-align: left; }
.side-scrim { display: none; }

/* Top-bar shell */
.shell-top { min-height: calc(100vh - var(--space-10)); display: flex; flex-direction: column; }
.appbar { position: sticky; top: var(--demo-h); z-index: var(--z-sticky); display: flex; align-items: center; gap: var(--space-4); min-height: var(--space-16); padding: var(--space-2) var(--space-6); background: var(--nav-bg); color: var(--nav-text); }
.appbar .brand { padding: 0; }
.topnav { display: flex; gap: var(--space-1); align-items: center; }
.topnav-item { display: inline-flex; gap: var(--space-2); align-items: center; min-height: var(--size-md); padding: 0 var(--space-4); border-radius: var(--r-pill); color: var(--nav-text); text-decoration: none; font: 500 var(--text-sm) var(--font); background: none; border: 0; cursor: pointer; }
.topnav-item:hover { background: var(--nav-hover); }
.topnav-item[aria-current="page"] { background: var(--nav-active); color: var(--nav-active-text); }
.topnav-item .ic:last-child:not(:first-child) { width: var(--icon-sm); height: var(--icon-sm); }
.appbar-btn { color: var(--nav-text); }
.appbar-btn:hover { background: var(--nav-hover); }
.avatar-btn { background: none; border: 0; padding: var(--space-half); border-radius: 50%; cursor: pointer; }
.bottomnav { display: none; }

/* Hero (summit dashboard) */
.hero { position: relative; overflow: hidden; border-radius: var(--r-l); padding: var(--space-8) var(--space-8) var(--space-16); margin-bottom: var(--gap); color: var(--ink-inverse); }
.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--hero-scrim-strong), var(--hero-scrim-mid) 55%, var(--hero-scrim-fade)); }
.hero > div { position: relative; }
.hero div { max-width: calc(var(--space-24) * 5 + var(--space-20)); }
.hero h1 { font: 700 var(--text-4xl)/var(--leading-tight) var(--font-display, var(--font)); margin: var(--space-1) 0 var(--space-2); outline: none; text-shadow: 0 var(--space-half) var(--space-3) var(--scrim-35); }
.hero p { text-shadow: 0 var(--border-w) var(--space-2) var(--scrim-45); font-size: var(--text-md); }
.hero-k { opacity: .95; font-weight: 600; }

/* Login */
.login { min-height: calc(100vh - var(--space-10)); display: grid; place-items: center; padding: var(--space-10) var(--space-4); outline: none; }
.login-box { width: min(calc(var(--space-24) * 4 + var(--space-8) + var(--space-1)), 100%); }
.login-brand { display: flex; gap: var(--space-3); align-items: center; justify-content: center; margin-bottom: var(--space-5); font-size: var(--text-md); }
.login-card .card-body { padding: var(--space-8); gap: var(--space-5); }
.login h1 { font: var(--h1); outline: none; }
.login .desc { color: var(--text-2); margin-top: var(--space-1); }

/* Design-system page */
.ds-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.ds-list { margin: 0; padding-left: var(--space-5); display: grid; gap: var(--space-2); }
.ds-h { font: 600 var(--text-sm) var(--font); color: var(--text-2); margin: var(--space-2) 0 calc(var(--space-1) * -1); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, calc(var(--space-24) + var(--space-12) + var(--space-2))), 1fr)); gap: var(--space-3); }
.swatch { display: grid; gap: var(--space-half); font-size: var(--text-xs); }
.sw-chip { height: var(--space-12); border-radius: var(--r-s); border: var(--border-w) solid var(--border); margin-bottom: var(--space-1); }
.swatch small { color: var(--text-2); font-family: var(--font-mono); }
.pair { display: inline-grid; place-items: center; width: var(--space-16); height: var(--space-8); border-radius: var(--r-s); font-weight: 700; border: var(--border-w) solid var(--border); }
.pass { color: var(--success-text); font-weight: 600; display: inline-flex; gap: var(--space-1); align-items: center; }
.fail { color: var(--danger-text); font-weight: 600; display: inline-flex; gap: var(--space-1); align-items: center; }
.type-row { display: grid; grid-template-columns: calc(var(--space-24) * 2 + var(--space-2)) 1fr; gap: var(--space-4); align-items: baseline; padding: var(--space-3) 0; border-bottom: var(--border-w) solid var(--border); }
.type-row:last-child { border-bottom: 0; }
.type-meta { color: var(--text-2); font-family: var(--font-mono); font-size: var(--text-xs); }
.ds-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
.ds-stack { display: grid; gap: var(--space-3); }
.ds-fields { max-width: calc(var(--space-24) * 7 + var(--space-20) + var(--space-2)); }
.shape { display: grid; gap: var(--space-2); justify-items: center; font-size: var(--text-xs); }
.shape span { width: var(--space-24); height: var(--space-16); background: var(--surface); border: var(--border-w-md) solid var(--border-strong); display: block; }
pre.code { margin: 0; padding: var(--space-4); background: var(--surface-2); border-radius: var(--r-s); max-height: var(--w-xs); overflow: auto; font-size: var(--text-xs); line-height: var(--leading-body); white-space: pre; }


.ds-tokens { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, calc(var(--space-24) + var(--space-12) + var(--space-2))), 1fr)); gap: var(--space-2); }
.ds-token { display: grid; gap: var(--space-1); align-content: start; min-width: 0; }
.ds-token code, .ds-token small { overflow-wrap: anywhere; }
.token-swatch, .token-radius, .token-shadow { display: block; height: var(--space-8); border-radius: var(--r-s); border: var(--border-w) solid var(--border); background: var(--surface); }
.token-bar { display: block; height: var(--space-2); max-width: 100%; background: var(--primary); border-radius: var(--r-pill); }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .edit-split { grid-template-columns: 1fr; }
  .preview { position: static; order: -1; max-width: calc(var(--space-24) * 4 + var(--space-8) + var(--space-1)); }
  .topnav-item .nav-label { display: none; }
  .topnav-item { padding: 0 var(--space-3); }
}
@media (max-width: 960px) {
  :root { --demo-h: 0; }
  .demo { position: static; }
  .side { height: 100vh; }
  .only-mobile { display: inline-flex !important; }
  .shell-side { grid-template-columns: 1fr; }
  .side { position: fixed; left: 0; top: 0; bottom: 0; z-index: var(--z-modal); width: min(calc(var(--space-24) * 3 + var(--space-3)), 86vw); transform: translateX(-102%); transition: transform var(--dur) var(--ease); box-shadow: var(--shadow-3); }
  body.nav-open .side { transform: none; }
  body.nav-open .side-scrim { display: block; position: fixed; inset: 0; background: var(--overlay); z-index: var(--z-overlay); }
  .topbar { padding: var(--space-2) var(--space-3); }
  .cmd { min-width: 0; flex: 1; }
  .cmd kbd { display: none; }
  .main { padding: var(--space-5) var(--space-4) var(--space-24); }
  .dash-grid, .quote-grid, .ds-grid { grid-template-columns: 1fr; }
  .inbox { grid-template-columns: 1fr; }
  .inbox.has-detail .inbox-list-wrap, .inbox.has-detail + * { display: none; }
  .inbox:not(.has-detail) .inbox-detail { display: none; }
  .inbox-detail { position: static; }
  .board { grid-template-columns: 1fr; }
  .topnav { display: none; }
  .appbar { padding: var(--space-2) var(--space-3); }
  .shell-top .main { padding-bottom: var(--space-24); }
  .bottomnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-sticky); background: var(--nav-bg); border-top: var(--border-w) solid var(--nav-line, transparent); padding: var(--space-2) var(--space-2) calc(var(--space-2) + env(safe-area-inset-bottom)); justify-content: space-around; }
  .bn-item { display: grid; justify-items: center; gap: var(--space-half); min-width: var(--space-16); padding: var(--space-2) var(--space-1); border-radius: var(--r-l); color: var(--nav-text); text-decoration: none; font: 500 var(--text-xs) var(--font); background: none; border: 0; position: relative; cursor: pointer; }
  .bn-item .ic { width: var(--icon-lg); height: var(--icon-lg); }
  .bn-item[aria-current="page"] { background: var(--nav-active); color: var(--nav-active-text); }
  .bn-item .count { position: absolute; top: 0; right: var(--space-2); margin: 0; }
  .toasts { bottom: var(--space-20); }
  .shell-side ~ .toasts, .toasts { right: var(--space-3); }
  .hero { padding: var(--space-6) var(--space-5) var(--space-12); }
  .hero h1 { font-size: var(--text-3xl); }
  .type-row { grid-template-columns: 1fr; gap: var(--space-1); }
}
@media (max-width: 720px) {
  .form-grid { grid-template-columns: 1fr; }
  .input, .select, .textarea, .money .input, .pal-in input { font-size: var(--text-md); }
  .stats { grid-template-columns: 1fr 1fr; gap: var(--space-3); }
  .stat-v { font-size: var(--text-2xl); line-height: var(--leading-snug); }

  /* Tables become cards */

/* Version 2 · Meadow — calm workspace (Linear, Notion, Apple HIG). Light sidebar, soft surfaces, drawers. */
:root {

body { font-size: var(--text-sm); letter-spacing: var(--tracking-body); font-feature-settings: "cv11", "ss01"; }

.me { border-color: var(--border); }
.topbar { background: color-mix(in srgb, var(--canvas) 82%, transparent); backdrop-filter: saturate(1.4) blur(var(--blur-topbar)); }
.cmd { border-color: var(--border-strong); box-shadow: var(--shadow-1); }

/* Soft cards */
.card, .tbl-wrap, .stat, .rowlist, .slide-row { box-shadow: var(--shadow-1); }
.stat-k .ic { color: var(--primary); }
.page-head { margin-bottom: var(--space-4); }

/* Segmented tabs */
.tabs { display: flex; flex-wrap: wrap; border: var(--border-w) solid var(--border); border-bottom: var(--border-w) solid var(--border); background: var(--surface-2); border-radius: var(--r-m); padding: var(--space-1); gap: var(--space-half); width: 100%; max-width: 100%; margin-bottom: var(--space-4); }

/* Rows are the default list */

/* Drawer editing */
.drawer { width: min(calc(var(--space-24) * 7 + var(--space-2)), 100%); border-left: var(--border-w) solid var(--border); }
.drawer-head { background: var(--canvas); }

.dlg { border-radius: var(--r-l); }

.topbar .btn-primary.btn-sm { height: var(--size-sm); }

/* Lists: sort, count, empty search */
.kbd-hint { position: absolute; right: var(--space-2); top: 50%; transform: translateY(-50%); font-size: var(--text-xs); padding: var(--space-0) var(--space-2); border: var(--border-w) solid var(--border-strong); border-radius: var(--r-xs); color: var(--text-3); pointer-events: none; }

/* Drawer: toolbar, sections, wide */
.drawer { width: min(calc(var(--space-24) * 7 + var(--space-2)), 100%); transition: width var(--dur) var(--ease); }

.chip { flex: none; min-height: var(--size-sm); padding: 0 var(--space-3); border: var(--border-w) solid var(--border-strong); border-radius: var(--r-pill); background: var(--surface); color: var(--text-2); font: 500 var(--text-xs) var(--font); cursor: pointer; }

<script>window.VERSION={"id":"meadow","file":"meadow.html","name":"Meadow","tagline":"Calm workspace","num":1,"fonts":"family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500","shell":"side","list":"rows","edit":"drawer","requests":"inbox","palette":true,"hero":false,"inspiration":"Linear, Notion, and Apple's Human Interface Guidelines","summary":"A quiet, professional workspace. A pale collapsible sidebar, soft cards, a Ctrl K command bar, an inbox for requests, and editors that slide in beside the list so you never lose your place.","traits":["Light sidebar that collapses to an icon rail; the current page is a white pill.","Ctrl K jumps to any page, tour, place, post, or request, with your recent items first.","Editing opens in a drawer beside the list, with previous and next, section links, a wide mode, View on site, and who saved it last.","The save bar counts unsaved changes and marks each edited field. Ctrl S saves.","Requests work like an inbox: Call, WhatsApp, and Email buttons, one-click status with undo, j and k to move.","The dashboard shows what needs attention and a log of recent changes.","Appearance and density are per-person settings in the account menu."],"principles":[["Stay in flow","Edit without leaving the list. Move to the next record with j, close with Esc, and you are where you were."],["Keyboard first, mouse friendly","Every common action has a shortcut, and every shortcut has a button."],["Always show the state","Unsaved changes are counted and marked, saves and status changes can be undone, and every change is logged with who made it."],["Calm by default","Low-contrast chrome, strong contrast where it matters: text, fields, focus."],["Point to the next step","The dashboard lists what needs attention, and every empty or no-match screen says what to do."]],"fontNote":"Inter with stylistic sets for clearer 1, l, and I. Tight letter spacing on headings. JetBrains Mono for codes.","shapeNote":"8 px controls, 12 px cards, 16 px dialogs. Soft two-layer shadows.","type":[["Page title · 600 24 / 1.35","font:600 var(--text-2xl)/var(--leading-snug) var(--font);letter-spacing:var(--tracking-tight)","Requests"],["Section · 600 16 / 1.5","font:600 var(--text-md)/var(--leading-body) var(--font)","Latest requests"],["Body · 400 14 / 1.5","font:400 var(--text-sm)/var(--leading-body) var(--font)","Family of 5, Hunza and Khunjerab, 7 days in late October."],["Label · 500 14 / 1.5","font:500 var(--text-sm)/var(--leading-body) var(--font)","Twin room rate"],["Nav · 500 14","font:500 var(--text-sm)/var(--leading-body) var(--font)","Rates and quotes"],["Code · JetBrains Mono 12","font:400 var(--text-xs)/var(--leading-body) var(--font-mono)","backups/preview-2026-10-09.json"]],"patterns":[["Navigation","Light sidebar with groups and an icon-rail mode ( [ ); command bar ( Ctrl K ); New menu for quick create; account menu for appearance, density, shortcuts, and sign out. Below the tablet breakpoint the sidebar becomes a drawer."],["Lists","Rows with thumbnail, details, and badges; search ( / ), filters, sort, a live count, and a No matches state with Clear filters."],["Editing","Right-hand drawer over the list: position and previous or next ( j k ), View on site, Expand, section chips, last saved by. Changed fields are marked, the save bar counts them, Ctrl S saves, and leaving asks first."],["Requests","Inbox split view with Call, WhatsApp, and Email; status is a segmented control that saves at once with Undo. On phones, list and message are separate screens."],["Dashboard","Counts, latest requests, Needs attention, recent activity, and quick actions, all filtered by role."],["Deletes","Confirm dialog for tours, logins, and roles; Undo for photos, reviews, slides, requests, and status changes."],["Tabs","Segmented control for rate types and request statuses."]],"others":[]};window.TWM_SEED={"activity":[{"at":"2026-10-09T09:20:00+05:00","who":"moeen@travelwithmoeen.com","text":"Changed the profit margin to 20 percent","href":"#/rates/margin"},{"at":"2026-10-09T08:55:00+05:00","who":"manager@travelwithmoeen.com","text":"Saved 3 hotel rates for Skardu Valley","href":"#/rates/hotels"},{"at":"2026-10-08T17:40:00+05:00","who":"manager@travelwithmoeen.com","text":"Moved Hamza Raza to In progress","href":"#/requests/2"},{"at":"2026-10-08T12:10:00+05:00","who":"editor@travelwithmoeen.com","text":"Saved tour 3 Days By Road Trip to Naran Kaghan and Babusar Top","href":"#/tours/121"},{"at":"2026-10-07T16:05:00+05:00","who":"sana.editor@travelwithmoeen.com","text":"Added a gallery photo","href":"#/gallery"},{"at":"2026-10-07T11:00:00+05:00","who":"editor@travelwithmoeen.com","text":"Saved place Hunza Valley","href":"#/places/hunza-valley"}],"tours":[{"id":"1_day_by_road_trip_to_islamabad","code":"101","name":"1 Day By Road Trip to Islamabad","duration":1,"featured":false,"transport":"By Road","location":"Islamabad Capital Territory","region":"Islamabad","description":"Explore the charming beauty and adventure of Islamabad with visits to iconic landmarks such as Faisal Mosque, Pakistan Monument, and Shakarparian. Enjoy a dining experience at Monal with breathtaking views, explore cultural heritage at Lok Virsa Museum, and end the day with shopping and local cuisine at Jinnah Super Market and F-10 Markaz.","image":"/images/All_Tour_Images/Islamabad/Picture1.jpeg","gallery":["/images/All_Tour_Images/Islamabad/Picture1.jpeg","/images/All_Tour_Images/Islamabad/Picture2.jpeg","/images/All_Tour_Images/Islamabad/Picture3.jpeg","/images/All_Tour_Images/Islamabad/Picture4.jpeg"],"pdf":"/images/pdf/1_day_by_road_trip_to_islamabad.pdf","categories":["Deluxe","Executive"],"packageTypes":["Couple"],"included":["Private Transport (GLI Car New Model)","Fuel","Toll Tax"],"notIncluded":["Lunch","Dinner","Entry Tickets","Personal Expenses","Recreation","Boating","Jeeps","Any items not mentioned in the services","Tour Guide If Required"],"days":[{"title":"The Modern Capital – Islamabad","text":"","highlights":["09:00 AM – Faisal Mosque: Start here before it gets crowded. Admire the architecture and the backdrop of the Margalla Hills.","11:00 AM – Pakistan Monument & Shakarparian: Visit the petal-shaped monument for the best history lesson and a full view of the city.","01:00 PM – Lunch at Monal (Margalla Hills): Drive up the mountain for the most famous dining experience in Pakistan with a breathtaking view.","03:30 PM – Lok Virsa Museum: Head back down to explore the cultural heritage and colorful artifacts of Pakistan’s four provinces.","05:30 PM – Saidpur Village: Walk through this restored 16th-century village to see the old temple and enjoy the sunset vibe.","07:30 PM – Jinnah Super Market (F-7): Do some quick souvenir shopping or browse the bookstores and local shops.","09:30 PM – Dinner & Nightlife (F-10 Markaz): Finish your day like a local. Grab Khyber Shinwari BBQ or enjoy chai and parathas in the bustling street food scene."]}],"updatedAt":"2026-10-09T03:00:00.000Z","updatedBy":"editor@travelwithmoeen.com","placeSlug":"","placeSlugs":[]},{"id":"1_day_by_road_trip_to_murree_and_patriata_family","code":"111","name":"1 Day By Road Trip to Murree and Patriata (Family)","duration":1,"featured":false,"transport":"By Road","location":"Murree and Patriata","region":"Murree Patriata Galiyat","description":"Enjoy a scenic day trip from Islamabad to Murree and Patriata, featuring visits to Mall Road, Pindi Point, and a cable car ride in Patriata. Experience the local culture, food, and shopping, with private transport included.","image":"/images/All_Tour_Images/MurreePatriataGaliyat/Picture1.jpg","gallery":["/images/All_Tour_Images/MurreePatriataGaliyat/Picture1.jpg","/images/All_Tour_Images/MurreePatriataGaliyat/Picture2.webp","/images/All_Tour_Images/MurreePatriataGaliyat/Picture3.jpg","/images/All_Tour_Images/MurreePatriataGaliyat/Picture1.jpg"],"pdf":"/images/pdf/byroadtrips/1_day_by_road_trip_to_murree_and_patriata_(family).pdf","categories":["Deluxe"],"packageTypes":["Family"],"included":["Private Transport (GLI Car New Model)","Fuel","Toll Tax","Guide"],"notIncluded":["Any Kind of Entry/Activity Ticket","Expenses for Boating","Horse Riding/Skiing","Any item not mentioned in services include","Portage","Tips","Laundry","Telephone charges","Transfers","All items of a personal nature","Food and drinks","Travel insurance"],"days":[{"title":"Islamabad to Murree and Patriata","text":"","highlights":["8:00 AM – Depart from Islamabad through Murree Motorway.","Enjoy a scenic drive through the hills (≈1.5–2 hours).","9:30 AM – Murree Mall Road.","Walk around shops and cafés, and enjoy the cool weather and lively atmosphere.","11:00 AM – Pindi Point","Take photos and enjoy panoramic views of the valleys.","12:30 PM – Lunch: Taste local Pakistani food or continental options on Mall Road.","1:30 PM – Drive to Patriata (New Murree)","A peaceful area surrounded by forests.","2:30 PM – Patriata Cable Car","Beautiful ride with stunning mountain views.","3:30 PM – Chair Lifts","Relaxing experience above pine trees and hills.","4:30 PM – Pindi Point Chair Lift","Another scenic ride before evening.","6:00 PM – Shopping Buy souvenirs, shawls, and local crafts.","7:00 PM – Return to Islamabad","8:30 PM – Arrival & end of trip"]}],"updatedAt":"2026-10-08T06:43:20.000Z","updatedBy":"moeen@travelwithmoeen.com","placeSlug":"","placeSlugs":[]},{"id":"10_days_by_air_trip_to_skardu_hunza_valley_couple","code":"253","name":"10 Days By Air Trip to Skardu & Hunza Valley (Couple)","duration":10,"featured":false,"transport":"By Air","location":"Deosai National Park","region":"Skardu & Hunza","description":"Experience a 10-day journey through the breathtaking landscapes of Skardu and Hunza Valley, including visits to Deosai National Park and Khunjerab Pass. Enjoy scenic flights, cultural explorations, and stunning natural vistas.","image":"/images/All_Tour_Images/SkarduValley/Picture1.jpg","gallery":["/images/All_Tour_Images/SkarduValley/Picture1.jpg","/images/All_Tour_Images/SkarduValley/Picture2.jpg","/images/All_Tour_Images/SkarduValley/Picture8.jpg","/images/All_Tour_Images/SkarduValley/Picture4.jpg"],"pdf":"/images/pdf/byairtrips/10_days_by_air_trip_to_skardu_&_hunza_valley_(couple).pdf","categories":["Deluxe","Premier","Executive","Luxury","Ultra Luxury"],"packageTypes":["Couple"],"included":["Air Tickets both Sides (With Window Seat-One way)","Private Transport (Parado TZ 2004-07 New Model)","Fuel - Toll Tax, and Entry Tickets","9 Nights’ Accommodation","9 Breakfasts"],"notIncluded":["Lunch & Dinner","Personal Expenses, Recreation, Boating, jeeps etc.","Any items not mentioned in the services","Portage, tips, laundry, telephone charges, transfers, all items of a personal nature","Food and drinks not specifically mentioned"],"days":[{"title":"Arrival in Skardu","text":"","highlights":["Morning flight from Islamabad to Skardu (One of the World's Most Scenic Flights)","Meet and greet at Skardu International Airport","Transfer to your hotel for check-in or directly leave for the tour","Visit the serene Shangri-La Resort (Lower Kachura Lake)","Upper Kachura Lake, followed by an exploration of the hidden Soq Valley","Evening: Enjoy leisure time and stunning sunset views","Overnight stay in a hotel"]},{"title":"Fort, Mosque, and Valley","text":"","highlights":["Morning: Enjoy a buffet breakfast at the resort","Drive to enchanting Khaplu Valley","Visit the magnificent Khaplu Palace—a royal heritage hotel","Explore Chaqchan Mosque—700 years old","Afternoon: Walk through Khaplu's charming streets and bazaars","Visit traditional apricot orchards","Evening: Leisure time in Khaplu's serene environment","Overnight: Hotel in Khaplu"]},{"title":"Waterfalls, Rock, and Deserts","text":"","highlights":["Morning: Enjoy a buffet breakfast at the resort","Depart for a scenic drive to the magnificent Manthoka Waterfall","En route: Experience the Sarfaranga Cold Desert at dusk","Visit Shigar Fort (a one-of-a-kind heritage boutique hotel)","Seek refuge and find adventure in a 400-year-old fort","Overnight stay at a Shigar"]},{"title":"Lakes, Fort and Shopping","text":"","highlights":["Morning: Enjoy a buffet breakfast at the resort","Departure: Arrive back in Skardu","Visit Blind Lake (Jarba Zhou) in Shigar Valley","Visit Hussainabad Waterfall or the optional Kharpocho Fort hiking","Visit the Skardu Bazaar for local handicrafts, dry fruits, and Balti souvenirs","Evening: Enjoy leisure time and stunning sunset views","Overnight stay in a hotel in Skardu"]},{"title":"Roof of the World and Sadpara Lake","text":"","highlights":["Morning: Enjoy a buffet breakfast at the resort","Depart for Deosai National Park, called the Roof of the World","Visit Sadpara Lake Photography and Sightseeing","Explore the stunning landscapes, meadows, and wildlife of Deosai","Visit Bara Pani and Kala Pani","Visit Sheosar Lake, an alpine lake situated at the western end of Deosai National Park","Evening: Enjoy leisure time, stunning sunset views, and back to the hotel","Overnight stay in a hotel"]},{"title":"Skardu to Hunza Road Journey (KKH)","text":"","highlights":["Morning: Enjoy a final buffet breakfast at the resort","Check out early leave for long travel to Hunza","Road Transit: Drive from Skardu to Karimabad, Hunza","Key Stop: Astak Nala, confluence of three mountains","Stop at the Rakaposhi Viewpoint near Gilgit for lunch","Evening: Arrive in Karimabad, check into your hotel, and rest and relax","Overnight stay at a hotel"]},{"title":"Hunza Exploration Offers Stunning Karakoram","text":"","highlights":["Morning: Enjoy a buffet breakfast at the resort","Visit the two ancient fortresses: the 900-year-old Altit Fort and the 700-year-old Baltit Fort","Afternoon: Explore the Karimabad Bazaar for local souvenirs, traditional shawls, and organic Hunzai products","Sunset: Drive up to Duikar (Eagle's Nest) for a breathtaking sunset panorama","Overnight stay in a hotel"]},{"title":"Hunza History & Sunset Panorama","text":"","highlights":["Morning: Enjoy a buffet breakfast at the resort","Full-Day Excursion: Drive north into Upper Hunza/Gojal Valley","Key Stops: Visit the stunning Attabad Lake","Continue north to the dramatic Passu Cones and the nearby thrilling Hussaini Suspension Bridge","Optional: Drive further north towards Sost","Note: A full-day trip to Khunjerab Pass","Overnight stay at Hunza"]},{"title":"Hunza to Skardu Road Journey Through Karakoram","text":"","highlights":["Morning: Enjoy a final buffet breakfast at the resort","Road Transit: Begin the return drive from Karimabad back to Skardu City","Activity: Stop for photos at any viewpoints you missed on the way up","Evening: Arrive back in Skardu, check into your hotel","Visit the Skardu Bazaar for local handicrafts, dry fruits, and Balti souvenirs","Prepare for your early morning flight","Overnight stay at Skardu"]},{"title":"Departure to Islamabad","text":"","highlights":["Morning: Enjoy a final buffet breakfast at the resort","Transfer: You will be transferred to Skardu Airport for your return flight to Islamabad"]}],"updatedAt":"2026-10-07T10:26:40.000Z","updatedBy":"sana.editor@travelwithmoeen.com","placeSlug":"","placeSlugs":[]},{"id":"2_days_by_road_trip_islamabad_city_tour","code":"102","name":"2 Days By Road Trip Islamabad City Tour","duration":2,"featured":false,"transport":"By Road","location":"Islamabad Capital Territory","region":"Islamabad","description":"Explore the charming beauty and adventure of Islamabad over two days. Visit iconic landmarks, enjoy local cuisine, and experience the vibrant culture and nightlife of the city.","image":"/images/All_Tour_Images/Islamabad/Picture2.jpeg","gallery":["/images/All_Tour_Images/Islamabad/Picture1.jpeg","/images/All_Tour_Images/Islamabad/Picture2.jpeg","/images/All_Tour_Images/Islamabad/Picture3.jpeg","/images/All_Tour_Images/Islamabad/Picture4.jpeg"],"pdf":"/images/pdf/byroadtrips/2_days_by_road__trip_islamabad_city_tour.pdf","categories":["Deluxe","Executive"],"packageTypes":["Couple"],"included":["Private Transport (GLI Car New Model) (1 Vehicle)","1 Night Accommodation","1 Breakfast"],"notIncluded":["Lunch – Dinner – Entry Tickets","Personal Expenses, Recreation, Boating, jeeps etc.","Fuel- Toll Tax","Any items not mentioned in the services"],"days":[{"title":"The Modern Capital – Islamabad","text":"","highlights":["09:00 AM – Faisal Mosque: Visit the iconic mosque for architecture and photos.","Lok Virsa Museum: Explore Pakistan’s cultural heritage and artifacts.","Lunch at Monal: Enjoy dining with panoramic views of the city from Margalla Hills.","Pakistan Monument: Visit the national landmark at Shakarparian.","Rawal Lake: Relax with a boat ride or lakeside walk.","Saidpur Village: Dinner in a restored historic village.","Nightlife & Vibe: End the day at Centaurus Mall for shopping and a movie, or visit F-10 Markaz to experience the local street vibe.","In F-10, you can enjoy late-night chai, parathas, and wraps while soaking in the bustling city energy.","Night in Islamabad Hotel"]},{"title":"Discover the Beautiful Enchanting Views and Hiking","text":"","highlights":["09:00 AM – Margalla Hills: Hike Trail 3 or drive to Daman-e-Koh for fresh air and city views.","Shah Allah Ditta Caves: Explore 2,400-year-old Buddhist caves and ancient banyan trees.","Lunch at Kohsar Market (F-6): Experience Islamabad’s high-end cafe culture (try Street 1 Cafe).","Railway Museum: Visit Golra Sharif Station to see vintage steam engines and colonial history.","Jinnah Super (F-7): Shop for souvenirs, leather goods, and handicrafts in the city's most famous market.","08:00 PM – Farewell Dinner: Enjoy authentic Afghan cuisine at Kabul Restaurant or local BBQ.","Quick Treat: Grab the famous Savour Foods pulao for a true local send-off.","Farewell Dinner at Kabul Restaurant (F-7): You cannot leave Islamabad without trying authentic Afghan cuisine. Their Lamb Tikka and Kabuli Pulao are legendary.","Final Stop: Savour Foods: If you have any room left, grab a quick plate of the famous 'Savour Foods' Pulao — it is an Islamabad institution.","Arrival back home, concluding the trip with lifelong memories."]}],"updatedAt":"2026-10-06T14:10:00.000Z","updatedBy":"editor@travelwithmoeen.com","placeSlug":"","placeSlugs":[]},{"id":"2_days_by_road_trip_to_murree_and_galiyat","code":"112","name":"2 Days By Road Trip to Murree and Galiyat","duration":2,"featured":false,"transport":"By Road","location":"Murree and Galiyat","region":"Murree Patriata Galiyat","description":"Experience the charming beauty and adventure of Murree and Galiyat with a 2-day road trip. Enjoy scenic drives, explore picturesque viewpoints, and engage in optional activities like chair lift rides and hiking. The trip includes a visit to Murree Mall Road, Nathiagali, and Ayubia National Park.","image":"/images/All_Tour_Images/MurreePatriataGaliyat/Picture1.jpg","gallery":["/images/All_Tour_Images/MurreePatriataGaliyat/Picture1.jpg","/images/All_Tour_Images/MurreePatriataGaliyat/Picture2.webp","/images/All_Tour_Images/MurreePatriataGaliyat/Picture3.jpg","/images/All_Tour_Images/MurreePatriataGaliyat/Picture1.jpg"],"pdf":"/images/pdf/byroadtrips/2_days_by_road_trip_to_murree_and_galiyat.pdf","categories":["Deluxe","Executive"],"packageTypes":["Couple","Family","Group"],"included":["Private Transport (GLI Car New Model)","Fuel","Toll Tax","1 Night Accommodation","1 Breakfast"],"notIncluded":["Lunch - Dinner","Personal Expenses","Recreation","Boating","Jeeps","Any items not mentioned in the services"],"days":[{"title":"Departure to Murree & Patriata","text":"","highlights":["Pickup from Islamabad at 08:30 AM","Drive toward Murree via the Expressway","Reach Patriata (New Murree) by early afternoon","Enjoy the Chair Lift & Cable Car Ride (Optional Activity)","Capture the sunset photography and scenic views","Visit Murree Mall Road if time permits","Check-in to your hotel in Murree or Nathiagali","Overnight stay"]},{"title":"Explore Nathiagali & Ayubia | Return","text":"","highlights":["After breakfast and check-out from the hotel, travel to Nathiagali","Explore scenic viewpoints and pine forests","Visit Ayubia National Park","Experience the Ayubia or take a short hike on the Pipeline Walking Track (Optional)","Enjoy a lunch break at a local spot","Begin the departure for the return journey","Arrival back to Islamabad by 09:00 PM"]}],"updatedAt":"2026-10-05T17:53:20.000Z","updatedBy":"moeen@travelwithmoeen.com","placeSlug":"","placeSlugs":[]},{"id":"3_days_by_road_trip_to_leepa_valley_and_ganga_choti_kashmir_couple","code":"131","name":"3 Days By Road Trip to Leepa Valley and Ganga Choti, Kashmir (Couple)","duration":3,"featured":false,"transport":"By Road","location":"Leepa Valley","region":"Neelum Valley Kashmir","description":"Experience a 3-day journey through the scenic Leepa Valley and Ganga Choti in Kashmir. Enjoy breathtaking landscapes, cultural exploration, and adventurous treks, with comfortable accommodations and guided tours.","image":"/images/All_Tour_Images/NeelumValleyKashmir/Picture1.jpg","gallery":["/images/All_Tour_Images/NeelumValleyKashmir/Picture1.jpg","/images/All_Tour_Images/NeelumValleyKashmir/Picture2.webp","/images/All_Tour_Images/NeelumValleyKashmir/Picture3.jpg","/images/All_Tour_Images/NeelumValleyKashmir/Picture4.jpg"],"pdf":"/images/pdf/byroadtrips/3_days_by_road_trip_to_leepa_valley_and_ganga_choti,_kashmir_(couple).pdf","categories":["Deluxe","Executive","Luxury"],"packageTypes":["Couple"],"included":["Private Transport (GLI Car New Model)","Fuel- Toll Tax","2 Nights’ Accommodation","3 Breakfasts","Tour Guide"],"notIncluded":["Any Kind of Entry/Activity Ticket","Expenses for Boating - Jeep","Expenses of Personal Nature","Horse Ridding / Ski","Any item not mentioned in services include","Portage, tips, laundry, telephone charges, transfers, all items of a personal nature, and also food and drinks.","Travel insurance"],"days":[{"title":"Islamabad to Leepa Valley","text":"","highlights":["05:00 AM (Islamabad Pickup)—Pick up Islamabad members and travel through Murree Motorway.","Morning: Depart for Muzaffarabad and then towards Reshian (Leepa Valley entry point).","Late Morning (11:00 AM): Reach Reshian. Obtain necessary travel permits (NOC/permission).","Noon (12:00 PM): Hire a local 4x4 Jeep (mandatory) and proceed over Reshian Gali/Dao Khan Pass to descend into the main Leepa Valley.","Afternoon (03:00 PM): Arrive in the Leepa Valley area (e.g., Dao Khan or Leepa Village). Check in and have a late lunch.","Evening: Quick exploration of the main Leepa Valley (wooden houses, rice fields) and the surrounding area like Dao Khan.","Night Stay: Leepa Valley / Dao Khan."]},{"title":"Waterfalls, Forest, and Old House!","text":"","highlights":["Early Morning (07:00 AM): Breakfast and immediate departure from Leepa Valley.","Drive back to Reshian, then towards Muzaffarabad, and onwards to the Bagh District.","Day Travel (08:00 AM - 02:00 PM): Long drive from the Leepa Valley area towards the town of Bagh, and then proceed to Sudhan Gali (the base for Ganga Choti).","Afternoon (03:00 PM): Arrive at Sudhan Gali. Check into your guesthouse.","Late Afternoon (04:00 PM): Start the trek to Ganga Choti Peak (3,045 m). The trek is generally moderate and takes about 1.5 to 2 hours one-way.","Evening (06:00 PM): Enjoy the views at the summit/meadows. Trek back down to Sudhan Gali before it gets too dark.","Night Stay: Sudhan Gali"]},{"title":"Departure to Islamabad","text":"","highlights":["08:00 AM Breakfast – Wake up and enjoy breakfast.","Departure for Islamabad","Photography and Sightseeing.","Islamabad Drop-off – Begin the journey back.","Arriving at Islamabad around 08:00 PM (+/- 2 hours).","End of services with satisfied clients and unforgettable memories!"]}],"updatedAt":"2026-10-04T21:36:40.000Z","updatedBy":"sana.editor@travelwithmoeen.com","placeSlug":"","placeSlugs":[]},{"id":"3_days_by_road_trip_to_murre_and_ayubia","code":"113","name":"3 Days By /All_Tour_Images/RattiGaliLake/Picture1.jpg"],"pdf":"/images/pdf/byroadtrips/3_daystriptorattigalilake.pdf","categories":["Deluxe","Executive","Luxury"],"packageTypes":["Couple"],"included":["Private Transport (GLI CAR New Model)","Fuel- Toll Tax","2 Nights’ Accommodation","3 Breakfasts","Tour Guide - Jeep"],"notIncluded":["Any Kind of Entry/Activity Ticket","Expenses for Boating - Jeep","Expenses of Personal Nature","Horse Ridding / Ski","Any item not mentioned in services include","Portage, tips, laundry, telephone charges, transfers, all items of a personal nature, and also food and drinks.","Anything not specifically mentioned in the ‘What your Tour Price includes’ box."],"days":[{"title":"Islamabad to Neelum Valley","text":"","highlights":["05:00 AM – Pick up Islamabad members.","Murree Motorway Drive—Enjoy a scenic drive through the motorway with a short break at Kohala Bridge for photos.","Muzaffarabad—Arrive in Muzaffarabad and stop for refreshment and a short break.","Dhanni Waterfall—Continue the drive towards Keran, pausing at Dhanni Waterfall for sightseeing.","Visit the Neelum Jhelum Hydropower Project.","Continue journey along the Neelum Valley road with short scenic stops.","Arrival at Dowarian—Reach Dowarian by late afternoon.","Evening walk in the local area to experience village life.","Relax, and explore the area.","Evening Activities – Enjoy a cozy bonfire & musical night.","Overnight Stay—Stay at a hotel in Dowarian/Keran."]},{"title":"Jeep Safari, Waterfalls, Glacier, and Hiking!","text":"","highlights":["Early Morning (07:00 AM): Breakfast and immediate departure from Dowarian Valley.","Jeep departure from Dowarian to Ratti Gali Base Camp (approx. 1–1.5 hours on mountainous track).","Short rest at base camp.","Guided or self-paced trek to Ratti Gali Lake (30–45 minutes; moderate difficulty).","Time at Ratti Gali Lake (2–3 hours):","Sightseeing and photography.","Walking around the lake.","Enjoying alpine scenery, glaciers, and wildflowers.","R -year-old Altit Fort and the 700-year-old Baltit Fort. (Anyone of these).","Afternoon: Explore the Karimabad Bazaar for local souvenirs, traditional shawls, and organic Hunzai products (like dried apricots and apricot oil).","Sunset: Drive up to Duikar (Eagle's Nest) for a breathtaking sunset panorama over the surrounding peaks, including Ultar Sar and Ladyfinger.","Overnight stay in Hotel."]},{"title":"Hunza History & Sunset Panorama","text":"","highlights":["Morning: Enjoy a final buffet breakfast at the resort.","Full Day Excursion: Drive north into Upper Hunza / Gojal Valley.","Key Stops: Visit the stunning Attabad Lake (the mesmerizing turquoise color is beautiful in November).","Continue north to the dramatic, Jagged Passu Cones and the nearby thrilling Hussaini Suspension Bridge.","Optional: If time and conditions permit, you can drive further north towards Sost (the last town before the Chinese border).","Note: A full day trip to Khunjerab Pass is not recommended in winter, due to extreme snow and cold. (Can be managed at Guest Choice)","Overnight stay at Hunza."]},{"title":"Hunza to Skardu Road Journey","text":"","highlights":["Morning: Enjoy a final buffet breakfast at the resort.","Road Transit: Begin the return drive from Karimabad back to Skardu City","Activity: Stop for photos at any viewpoints you missed on the way up. The journey will take approximately 8–10 hours.","Evening: Arrive back in Skardu, check into your hotel","Visit the Skardu Bazaar for local handicrafts, dry fruits, and Balti souvenirs.","Overnight stay at Skardu."]},{"title":"Departure to Islamabad","text":"","highlights":["Morning: Enjoy a final buffet breakfast at the resort.","Transfer: You will be transferred to Skardu Airport for your return flight to Islamabad, filled with unforgettable memories."]}],"updatedAt":"2026-09-14T14:56:40.000Z","updatedBy":"sana.editor@travelwithmoeen.com","placeSlug":"skardu-valley","placeSlugs":["skardu-valley"]},{"id":"6_days_by_road_trip_to_minimar   /* ---------- Editor container: page, drawer, or page with live preview ---------- */

  /* ---------- Screens ---------- */
  const SCREENS = {};

  const hoursAgo = (iso) => (NOW - Date.parse(iso)) / 36e5;
  SCREENS.dashboard = () => {
    const d = D(), R = d.requests, nw = R.filter((r) => r.status === "new"), prog = R.filter((r) => r.status === "in_progress");
    const stat = (ic, label, value, meta, href) => `<a class="stat" href="${href}"><span class="stat-k">${icon(ic)}${esc(label)}</span><span class="stat-v">${value}</span><span class="stat-m">${esc(meta)}</span></a>`;

    const oldNew = nw.filter((r) => hoursAgo(r.at) > 24).length;

    }
    if (can.content()) {

    }
    if (can.backup()) {
      const age = hoursAgo(d.backups[0].at);
      todo.push(age > 26 ? ["warning", "database", "The last backup is more than a day old", "#/backups", "Back up"] : ["success", "database", `Backup made ${rel(d.backups[0].at).toLowerCase()}`, "#/backups", "View"]);
    }
    const act = (d.activity || []).slice(0, 6);
    const greet = "Good morning";
    return `${pageHead(greet, { desc: `${dt("2026-10-09T09:30:00+05:00", { dateStyle: "full" })} · signed in as ${ROLE_NAME[S.role]}. The Owner and an Editor can delete a tour. A Manager cannot.` })}

      </div>
      ${can.rates() ? (() => { const view = quoteView(); return `<section class="card"><div class="card-head"><div><h3>Latest quote</h3><p>${view.nights.length ? `${view.nights.length} nights, then ${view.pct}% profit.` : "No hotel night. Then " + view.pct + "% profit."}</p></div>${btn("Open quote", { v: "ghost", size: "sm", href: "#/rates/quote" })}</div><div class="card-body"><div class="stats">
        <div class="stat"><span class="stat-k">Guest sees</span><span class="stat-v">${view.refused ? "Refused" : rs(view.guest)}</span><span class="stat-m">${view.refused ? "Neither a hotel nor other services." : "One total. No lines and no profit."}</span></div>

      </div></div></section>`; })() : ""}
      <div class="dash-grid">
        <section class="card"><div class="card-head"><div><h3>Latest requests</h3><p>Newest first</p></div>${btn("Open inbox", { v: "ghost", size: "sm", href: "#/requests" })}</div>

  };

  /* Requests: table + page, inbox split, or board */
  const reqFilter = (q) => {
    let rows = [...D().requests].sort((a, b) => b.at.localeCompare(a.at));

  };
  const wa = (phone) => { const d = String(phone || "").replace(/\D/g, ""); return d ? `https://wa.me/${d.startsWith("0") ? "92" + d.slice(1) : d}` : ""; };
  const reqDetail = (r, compact = false, nav = null) => `
    <div class="req-detail">
      ${compact ? `<div class="req-head"><div><h2 tabindex="-1" id="req-title">${esc(r.name)}</h2><p class="desc">${KIND[r.kind]} · <time datetime="${r.at}" title="${dt(r.at, { dateStyle: "full", timeStyle: "short" })}">${dt(r.at)}</time></p></div>
        <div class="req-nav">${nav ? `<span class="drawer-pos">${nav.index + 1} of ${nav.total}</span>${nav.prev ? btn("Previous request", { v: "ghost", size: "sm", iconOnly: true, ic: "chevU", href: nav.prev, a: { "data-prev": true, title: "Previous ( k )" } }) : ""}${nav.next ? btn("Next request", { v: "ghost", size: "sm", iconOnly: true, ic: "chevD", href: nav.next, a: { "data-next": true, title: "Next ( j )" } }) : ""}` : ""}</div></div>` : ""}
      <div class="contact-actions">
        ${r.phone ? `<a class="btn btn-secondary btn-sm" href="tel:${esc(r.phone.replace(/\s/g, ""))}">${icon("phone")}<span>Call</span></a><a class="btn btn-secondary btn-sm" href="${esc(wa(r.phone))}?text=${encodeURIComponent(`Assalam o Alaikum ${r.name.split(" ")[0]}, this is Travel With Moeen about your ${KIND[r.kind].toLowerCase()} request.`)}" target="_blank" rel="noopener noreferrer">${icon("whatsapp")}<span>WhatsApp</span><span class="sr-only"> (opens in a new tab)</span></a>` : ""}
        ${r.email ? `<a class="btn btn-secondary btn-sm" href="mailto:${esc(r.email)}?subject=${encodeURIComponent("Your request to Travel With Moeen")}">${icon("mail")}<span>Email</span></a>` : ""}
      </div>
      <dl class="dl">${r.phone ? `<dt>Phone</dt><dd>${esc(r.phone)}</dd>` : ""}${r.email ? `<dt>Email</dt><dd>${esc(r.email)}</dd>` : ""}${r.tour ? `<dt>Tour</dt><dd>${esc(r.tour)}</dd>` : ""}<dt>Received</dt><dd>${dt(r.at, { dateStyle: "full", timeStyle: "short" })}</dd></dl>
      <div class="message"><span class="message-k">Message</span>${esc(r.message)}</div>
      ${can.requestStatus() ? `<div class="status-row">
          <fieldset class="seg-status"><legend class="label">Status</legend><div class="seg-track">${[["new", "New"], ["in_progress", "In progress"], ["closed", "Closed"]].map(([v, l]) => `<label class="seg-opt"><input type="radio" name="req-status-${r.id}" value="${v}" ${r.status === v ? "checked" : ""} data-instant-status data-id="${r.id}"><span>${l}</span></label>`).join("")}</div></fieldset>

        </div><p class="help">Status saves as soon as you choose it. You can undo for 10 seconds.</p>` : alert("info", "Read only", "Editors can read requests. The Owner or a Manager changes the status.")}
    </div>`;
  SCREENS.requests = (id, q) => {
    const rows = reqFilter(q);
    const r = id ? D().requests.find((x) => String(x.id) === id) : null;
    const head = pageHead("Requests", { desc: "Messages, custom trips, and bookings from the website." });
    const kindOpts = [["", "All kinds"], ["booking", "Booking"], ["custom", "Custom trip"], ["contact", "Contact"]];

  /* Rates */
  const moneyCell = (name, v, label) => `<div class="money money-sm"><span class="affix" aria-hidden="true">Rs</span><input class="input" name="${esc(name)}" id="${esc(name)}" inputmode="numeric" autocomplete="off" value="${esc(num(v))}" data-money aria-label="${esc(label)}"></div>`;
  const RATE_TABS = [["hotels", "Hotels"], ["catalog", "Hotel catalog"], ["vehicles", "Vehicles"], ["air", "Air extras"], ["jeeps", "Jeep lines"], ["margin", "Profit margin"], ["quote", "Quote"]];

        ${d.hotels.map((h) => { const L = `${h.place}, ${h.start}, ${h.grade}`; return `<tr data-search="${esc((h.place + " " + h.hotel).toLowerCase())}" data-f-place="${esc(h.place)}" data-f-grade="${esc(h.grade)}"><td data-label="Place">${esc(h.place)}</td><td data-label="Start">${esc(h.start)}</td><td data-label="Grade">${esc(h.grade)}</td>
          <td data-label="Twin" class="r">${moneyCell(`twin_${h.id}`, h.twin, `Twin rate, ${L}`)}</td><td data-label="3-share" class="r">${moneyCell(`triple_${h.id}`, h.triple, `3-share rate, ${L}`)}</td>

    if (k === "rates" || k === "plans") return can.rates() || "Rates, quotes, and trip plans are open to the Owner and the Manager.";

  /* ---------- Money formatting ---------- */
